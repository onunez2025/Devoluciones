<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Devoluciones</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7F8FA; color: #1A1C1E; }
        @media (prefers-color-scheme: dark) { body { background: #0B1220; color: #F9FAFB; } .caja { background: #111C2A; border-color: #1E293B; } }
        .caja { max-width: 420px; text-align: center; background: #fff; border: 1px solid #E2E4E9;
                border-radius: 16px; padding: 32px 28px; }
        img { width: 72px; height: 72px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 20px; line-height: 1.5; opacity: .8; font-size: 14px; }
        button { font: inherit; font-weight: 600; color: #fff; background: #4C5F80; border: 0;
                 border-radius: 10px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/icons/icon-192.png" alt="" />
        <h1>Sin conexión</h1>
        <!-- Se dice la verdad: sin red no hay datos ni sesión, así que no se finge una aplicación vacía. -->
        <p>Esta aplicación necesita conexión para registrar devoluciones y consultar su estado. Vuelve a intentarlo cuando tengas red.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
